name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run repository verification
        run: scripts/verify.sh

  parser-lite:
    name: Verify pinned lightweight parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pinned optional parsers
        run: python -m pip install -r requirements-parser-lite.txt
      - name: Check installed parser versions
        run: |
          python -c 'from importlib.metadata import version; assert version("markitdown") == "0.1.8"; assert version("liteparse") == "2.14.7"'
      - name: Check parser declarations match installed packages
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import parser_adapter

          catalog = parser_adapter.backend_catalog()
          for backend in ("markitdown", "liteparse"):
              assert catalog[backend]["package"] == backend, catalog[backend]
              assert catalog[backend]["installed"], catalog[backend]
          PY
      - name: Run repository verification with optional parsers
        run: scripts/verify.sh
